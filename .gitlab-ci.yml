# GitLab CI — Deployd
#
# Jobs:
#   sast             — Static Application Security Testing (GitLab template)
#   secret_detection — Secret Detection (GitLab template)
#   test-nexus-upload — Test the repository-owned Nexus upload client
#   build-env-image  — Build and push the deployd build-env image to the registry
#   build-appimage   — Build and publish the Deployd AppImage
#   build-snap       — Build and publish the Deployd Snap package
#   upload-nexus     — Publish tagged AppImage updates to Nexus Mods
#   pages            — Publish the Deployd feature page
#
# Build environment image
# -----------------------
# The AppImage build runs directly inside $CI_REGISTRY_IMAGE/build-env:latest,
# which is built from packaging/appimage/Dockerfile.  The image is published to
# the project's GitLab Container Registry and only rebuilt when the Dockerfile
# changes (or via manual trigger).
#
# Bootstrap: on first use, trigger build-env-image manually from the GitLab UI
# before running a release pipeline.
#
# Local builds use LXD (preferred) or Docker — see build-appimage.sh.

stages:
  - test
  - secret-detection
  - build-env
  - build
  - deploy

# ── Security scanning ────────────────────────────────────────────────────────
include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml

variables:
  SECRET_DETECTION_ENABLED: 'true'

sast:
  stage: test

secret_detection:
  stage: secret-detection

test-nexus-upload:
  stage: test
  image: python:3.13-slim
  script:
    - python3 scripts/test_package_nexus_release.py
    - python3 scripts/test_nexus_upload.py

# ── Build environment image ──────────────────────────────────────────────────
build-env-image:
  stage: build-env
  image: docker:28
  services:
    - docker:28-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_VERIFY: 1
    DOCKER_CERT_PATH: "$DOCKER_TLS_CERTDIR/client"
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - docker build
        --tag "$CI_REGISTRY_IMAGE/build-env:latest"
        --file packaging/appimage/Dockerfile
        packaging/appimage/
    - docker push "$CI_REGISTRY_IMAGE/build-env:latest"
  rules:
    - changes:
        - packaging/appimage/Dockerfile
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual

# ── AppImage build ───────────────────────────────────────────────────────────
# Runs directly inside the pre-built registry image — no Docker daemon needed.
build-appimage:
  stage: build
  image: $CI_REGISTRY_IMAGE/build-env:latest
  needs:
    - job: build-env-image
      optional: true
  script:
    - bash packaging/appimage/build-appimage-inner.sh
  artifacts:
    name: "Deployd-$CI_COMMIT_TAG"
    paths:
      - Deployd-x86_64.AppImage
    expire_in: 90 days
  rules:
    # Build on version tags (e.g. v0.9.6)
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/'
    # Allow manual trigger on any branch/MR
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual

# ── Snap build ───────────────────────────────────────────────────────────────
# Intentionally parallel with build-appimage: each runs in its own Docker
# container with a fresh checkout and has no dependency on the other.
build-snap:
  stage: build
  image: canonical/snapcraft:8_core24
  script:
    - snapcraft --destructive-mode
  artifacts:
    name: "Deployd-snap-$CI_COMMIT_TAG"
    paths:
      - "*.snap"
    expire_in: 90 days
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/'
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual

# ── Nexus Mods release ───────────────────────────────────────────────────────
# @affects: appimage
# NEXUSMODS_API_KEY and NEXUSMODS_FILE_ID must be protected GitLab CI/CD
# variables. The API key must also be masked. The v3 upload API targets an
# existing Nexus file, so the file ID cannot be inferred from the mod-page ID.
upload-nexus:
  stage: deploy
  image: python:3.13-slim
  needs:
    - job: build-appimage
      artifacts: true
  resource_group: nexus-production
  interruptible: false
  script:
    - test -n "$NEXUSMODS_API_KEY"
    - test -n "$NEXUSMODS_FILE_ID"
    - export RELEASE_VERSION="${CI_COMMIT_TAG#v}"
    - export APPIMAGE_FILENAME="Deployd-${RELEASE_VERSION}-x86_64.AppImage"
    - export NEXUS_FILENAME="Deployd-${RELEASE_VERSION}-x86_64.zip"
    - mv Deployd-x86_64.AppImage "$APPIMAGE_FILENAME"
    - |
      python3 scripts/package_nexus_release.py \
        --appimage "$APPIMAGE_FILENAME" \
        --output "$NEXUS_FILENAME"
    - |
      python3 scripts/nexus_upload.py \
        --file "$NEXUS_FILENAME" \
        --file-id "$NEXUSMODS_FILE_ID" \
        --version "$RELEASE_VERSION" \
        --display-name "Deployd $RELEASE_VERSION (AppImage ZIP)" \
        --archive-existing
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'

# ── GitLab Pages ─────────────────────────────────────────────────────────────
pages:
  stage: deploy
  image: alpine:3.20
  script:
    - sh scripts/build-pages.sh
  artifacts:
    paths:
      - out
  publish: out
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
