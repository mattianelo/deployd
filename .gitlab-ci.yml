# GitLab CI — Deployd
#
# Jobs:
#   sast            — Static Application Security Testing (GitLab template)
#   secret_detection — Secret Detection (GitLab template)
#   build-appimage  — Build and publish the Deployd AppImage
#
# AppImage build uses Docker-in-Docker (dind).
# The deployd-build-env image is built from packaging/appimage/Dockerfile
# (ubuntu:24.04 + GTK4/libadwaita dev stack + Rust + linuxdeploy tooling).
# The inner build script runs directly inside that image (DEPLOYD_NO_DOCKER=1).

stages:
  - test
  - secret-detection
  - build
  - build-snap

# ── Security scanning ────────────────────────────────────────────────────────
include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml

variables:
  SECRET_DETECTION_ENABLED: 'true'

sast:
  stage: test

secret_detection:
  stage: secret-detection

# ── AppImage build ───────────────────────────────────────────────────────────
build-appimage:
  stage: build
  image: docker:28
  services:
    - docker:28-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    # Tell Docker to use the dind daemon's socket.
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_VERIFY: 1
    DOCKER_CERT_PATH: "$DOCKER_TLS_CERTDIR/client"
  before_script:
    # Build the deployd build-environment image from our Dockerfile.
    # Layer caching is not configured here; the image is small enough that
    # rebuilding it per pipeline is acceptable. Add registry caching if needed.
    - docker build
        --tag deployd-build-env
        --file packaging/appimage/Dockerfile
        .
  script:
    # Run the inner build script inside the container.
    # DEPLOYD_NO_DOCKER=1 skips the host-side Docker wrapper entirely.
    - |
      docker run --rm \
        -v "$CI_PROJECT_DIR:/workspace:z" \
        -e VERSION="$(grep '^version' Cargo.toml | head -1 | sed 's/.*= *"\(.*\)"/\1/')" \
        -e DEPLOYD_NO_DOCKER=1 \
        --workdir /workspace \
        deployd-build-env \
        bash packaging/appimage/build-appimage-inner.sh
  artifacts:
    name: "Deployd-$CI_COMMIT_TAG"
    paths:
      - Deployd-x86_64.AppImage
    expire_in: 90 days
  rules:
    # Build on version tags (e.g. v0.9.6)
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/'
    # Allow manual trigger on any branch/MR
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual

# ── Snap build ───────────────────────────────────────────────────────────────
build-snap:
  stage: build-snap
  image: snapcore/snapcraft:latest
  before_script:
    # Fetch the latest UMU Launcher zipapp and place it where snapcraft.yaml expects it.
    - |
      UMU_TAG=$(curl -fsSL https://api.github.com/repos/Open-Wine-Components/umu-launcher/releases/latest \
        | grep '"tag_name"' | head -1 | cut -d'"' -f4)
      mkdir -p snap/local
      wget -q \
        "https://github.com/Open-Wine-Components/umu-launcher/releases/download/${UMU_TAG}/umu-launcher-${UMU_TAG}-zipapp.tar" \
        -O snap/local/umu-launcher-zipapp.tar
  script:
    - snapcraft pack --destructive-mode
  artifacts:
    name: "Deployd-snap-$CI_COMMIT_TAG"
    paths:
      - "*.snap"
    expire_in: 90 days
  rules:
    # Build on version tags (e.g. v0.9.8)
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/'
    # Allow manual trigger on any branch/MR
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
