stages:
  - build-env
  - validate
  - compile
  - test
  - observe
  - secret-detection
  - build
  - deploy

include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml

workflow:
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - when: never

variables:
  SECRET_DETECTION_ENABLED: "true"
  BUILD_ENV_IMAGE_REVISION: "v2"
  BUILD_ENV_IMAGE_TAG: "rust-1.96.1-fossil-0.1.8-v2"
  BUILD_ENV_PUBLISH_TAG: "rust-1.96.1-fossil-0.1.8-v2"
  BUILD_ENV_IMAGE: "$CI_REGISTRY_IMAGE/build-env:$BUILD_ENV_IMAGE_TAG"
  RUST_CACHE_VERSION: "v1"

.shared-pipeline:
  rules: &shared-pipeline-rules
    - if: '$CI_PIPELINE_SOURCE == "web"'

.rust-job:
  image: $BUILD_ENV_IMAGE
  variables:
    CARGO_HOME: "$CI_PROJECT_DIR/.ci-cache/cargo"
    CARGO_TARGET_DIR: "$CI_PROJECT_DIR/.ci-cache/target"
  before_script:
    - export HOME=/home/ubuntu
    - ./scripts/ci-environment.sh
    - mkdir -p "$CARGO_HOME" "$CARGO_TARGET_DIR"

.rust-cache:
  cache: &rust-cache
    key:
      files:
        - Cargo.lock
        - rust-toolchain.toml
      prefix: "$BUILD_ENV_IMAGE_TAG-$RUST_CACHE_VERSION"
    paths:
      - .ci-cache/cargo/registry/
      - .ci-cache/cargo/git/
      - .ci-cache/target/

sast:
  stage: test

secret_detection:
  stage: secret-detection

policy-validation:
  extends: .rust-job
  stage: validate
  rules: *shared-pipeline-rules
  script:
    - bash -n check.sh scripts/*.sh scripts/mcp/*.sh packaging/appimage/*.sh
    - python3 scripts/test_ci_file_size.py
    - python3 scripts/ci_file_size.py
    - python3 scripts/test_ci_test_inventory.py
    - python3 scripts/ci_test_inventory.py validate
    - python3 scripts/test_ci_policy.py
    - python3 scripts/ci_policy.py
    - ./scripts/test_ci_environment.sh
    - ./scripts/test_check_wrapper.sh
    - ./scripts/test_mcp_wrappers.sh
    - ./scripts/ci-ownership-smoke.sh

release-metadata:
  stage: validate
  image: python:3.13-slim
  script:
    - python3 scripts/release_metadata.py --tag "$CI_COMMIT_TAG"
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'

instruction-drift:
  extends: .rust-job
  stage: validate
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "web"'
  script:
    - python3 scripts/test_ci_instruction_drift.py
    - python3 scripts/ci_instruction_drift.py

rust-fmt:
  extends: .rust-job
  stage: validate
  rules: *shared-pipeline-rules
  script:
    - ./scripts/rust-command.sh run fmt -- --check

rust-check:
  extends: .rust-job
  stage: compile
  rules: *shared-pipeline-rules
  cache:
    <<: *rust-cache
    policy: pull-push
  script:
    - ./scripts/rust-command.sh run check
    - ./scripts/ci-ownership-smoke.sh

rust-clippy:
  extends: .rust-job
  stage: test
  rules: *shared-pipeline-rules
  needs:
    - rust-check
  cache:
    <<: *rust-cache
    policy: pull
  script:
    - ./scripts/rust-command.sh run clippy -- -D warnings
    - ./scripts/ci-ownership-smoke.sh

rust-nextest:
  extends: .rust-job
  stage: test
  rules: *shared-pipeline-rules
  needs:
    - rust-check
  cache:
    <<: *rust-cache
    policy: pull
  script:
    - ./scripts/rust-command.sh run nextest run
    - ./scripts/ci-ownership-smoke.sh

rust-inventory:
  extends: .rust-job
  stage: test
  rules: *shared-pipeline-rules
  needs:
    - rust-check
  parallel:
    matrix:
      - TEST_GROUP:
          - variant:appimage
          - variant:snap
          - engine:bethesda
          - engine:aurora
          - engine:eclipse
          - engine:redengine
  cache:
    <<: *rust-cache
    policy: pull
  script:
    - ./scripts/ci-inventory-tests.sh "$TEST_GROUP"

test-nexus-upload:
  extends: .rust-job
  stage: test
  rules: *shared-pipeline-rules
  script:
    - python3 scripts/test_release_metadata.py
    - python3 scripts/test_package_nexus_release.py
    - python3 scripts/test_nexus_upload.py

test-pages-build:
  extends: .rust-job
  stage: test
  rules: *shared-pipeline-rules
  script:
    - sh scripts/test_build_pages.sh

fossil-observation:
  extends: .rust-job
  stage: observe
  variables:
    GIT_DEPTH: "0"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: always
  allow_failure: true
  script:
    - ./scripts/ci-fossil.sh observe .ci-artifacts/fossil
  artifacts:
    when: always
    expire_in: 90 days
    paths:
      - .ci-artifacts/fossil/fossil-scan.json
      - .ci-artifacts/fossil/fossil-scaffolding.json

fossil-diff:
  extends: .rust-job
  stage: observe
  allow_failure: false
  variables:
    GIT_DEPTH: "0"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
  script:
    - git fetch origin "$CI_DEFAULT_BRANCH"
    - base_sha="$(git merge-base "$CI_COMMIT_SHA" FETCH_HEAD)"
    - ./scripts/ci-fossil.sh diff .ci-artifacts/fossil "$base_sha"
  artifacts:
    when: always
    expire_in: 90 days
    paths:
      - .ci-artifacts/fossil/fossil-diff.json

dependency-audit:
  extends: .rust-job
  stage: test
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  cache:
    <<: *rust-cache
    policy: pull
  script:
    - ./scripts/rust-command.sh run audit
    - ./scripts/ci-ownership-smoke.sh

dependency-freshness:
  extends: .rust-job
  stage: test
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  allow_failure: true
  script:
    - ./scripts/ci-freshness.sh
  artifacts:
    when: always
    expire_in: 90 days
    paths:
      - .ci-artifacts/freshness/cargo-update-dry-run.txt

mcp-protocol-smoke:
  extends: .rust-job
  stage: test
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "web"'
      changes:
        - fossil.toml
        - packaging/appimage/Dockerfile
        - packaging/appimage/mcp-versions.sh
        - packaging/appimage/install-fossil.sh
        - packaging/appimage/install-rust-analyzer-mcp.sh
        - packaging/appimage/provision-mcp.sh
        - scripts/ci-fossil-mcp.sh
        - scripts/ci-mcp-smoke.sh
        - scripts/ci-rust-analyzer-mcp.sh
        - scripts/mcp/**/*
        - scripts/test_mcp_smoke.py
  needs:
    - job: rust-check
      optional: true
  cache:
    <<: *rust-cache
    policy: pull
  script:
    - ./scripts/ci-mcp-smoke.sh

build-env-image:
  stage: build-env
  image: docker:28
  services:
    - docker:28-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_VERIFY: 1
    DOCKER_CERT_PATH: "$DOCKER_TLS_CERTDIR/client"
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "web"'
    - when: never
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - if docker manifest inspect "$CI_REGISTRY_IMAGE/build-env:$BUILD_ENV_PUBLISH_TAG" >/dev/null 2>&1; then echo "immutable build image already exists"; exit 0; fi
    - docker build --pull --no-cache --tag "$CI_REGISTRY_IMAGE/build-env:$BUILD_ENV_PUBLISH_TAG" --file packaging/appimage/Dockerfile .
    - docker push "$CI_REGISTRY_IMAGE/build-env:$BUILD_ENV_PUBLISH_TAG"
    - docker tag "$CI_REGISTRY_IMAGE/build-env:$BUILD_ENV_PUBLISH_TAG" "$CI_REGISTRY_IMAGE/build-env:latest"
    - docker push "$CI_REGISTRY_IMAGE/build-env:latest"

build-appimage:
  stage: build
  image: $BUILD_ENV_IMAGE
  needs:
    - job: release-metadata
      optional: true
    - job: build-env-image
      optional: true
  script:
    - bash packaging/appimage/build-appimage-inner.sh
  artifacts:
    name: "Deployd-$CI_COMMIT_TAG"
    paths:
      - Deployd-x86_64.AppImage
    expire_in: 90 days
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
    - if: '$CI_PIPELINE_SOURCE == "web"'

upload-nexus:
  stage: deploy
  image: python:3.13-slim
  needs:
    - job: build-appimage
      artifacts: true
  resource_group: nexus-production
  interruptible: false
  script:
    - test -n "$NEXUSMODS_API_KEY"
    - test -n "$NEXUSMODS_FILE_ID"
    - export RELEASE_VERSION="${CI_COMMIT_TAG#v}"
    - export APPIMAGE_FILENAME="Deployd-${RELEASE_VERSION}-x86_64.AppImage"
    - export NEXUS_FILENAME="Deployd-${RELEASE_VERSION}-x86_64.zip"
    - mv Deployd-x86_64.AppImage "$APPIMAGE_FILENAME"
    - |
      python3 scripts/package_nexus_release.py \
        --appimage "$APPIMAGE_FILENAME" \
        --output "$NEXUS_FILENAME"
    - |
      python3 scripts/nexus_upload.py \
        --file "$NEXUS_FILENAME" \
        --file-id "$NEXUSMODS_FILE_ID" \
        --version "$RELEASE_VERSION" \
        --display-name "Deployd $RELEASE_VERSION (AppImage ZIP)" \
        --archive-existing
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'

pages:
  stage: deploy
  image: alpine:3.20
  script:
    - sh scripts/build-pages.sh
  artifacts:
    paths:
      - out
  publish: out
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
    - if: '$CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
      allow_failure: true
