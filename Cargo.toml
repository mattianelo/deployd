[package]
name = "deployd"
version = "3.0.1"
edition = "2024"

[dependencies]
relm4 = { version = "0.10", features = ["macros", "libadwaita"] }
relm4-components = "0.10"
gtk = { version = "0.10", package = "gtk4", features = ["v4_10"] }
libadwaita = { version = "0.8", features = ["v1_5"] }
glib = "0.21"
gio = "0.21"

# Core
anyhow = "1.0.103"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "chrono"] }
tokio = { version = "1", features = ["full"] }
# Process-group signalling for Deployd-owned external tool sessions.
libc = "0.2"

# Mod handling
# Parse ME3Tweaks moddesc.ini while preserving Windows path separators.
rust-ini = "=0.21.3"
# Rewrite game-owned LE2 squad-selection SWF assets without bundling compiled UI.
swf = { version = "=0.2.2", default-features = false, features = ["flate2"] }
tempfile = "3"
walkdir = "2"
zip = "2"
sevenz-rust2 = "0.20"
# Decode bounded M3M manifests and assets with the existing archive codec.
lzma-rust2 = { version = "=0.16.2", default-features = false, features = ["std"] }
compress-tools = { version = "0.15", optional = true }
unrar = "0.5"
quick-xml = { version = "=0.41.0", features = ["serialize"] }
regex = "1"
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
md-5 = "0.10"
sha2 = "0.10"
dirs = "5"

# Nexus API
# Constrain the shared HTTPS and SSO TLS stack to the RUSTSEC-2026-0285 fix.
rustls = { version = "=0.23.45", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
ashpd = { version = "0.13", features = ["documents", "file_chooser", "trash"] }
futures-util = "0.3"
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
open = "5"

# Shared CRC-32 validates M3TO BTP/BTM pairing independently of LOOT.
crc32fast = "=1.5.0"

# LOOT integration (optional feature)
libloot = { version = "0.29", optional = true }

[features]
default = ["loot"]
loot = ["dep:libloot"]
# Enable libarchive fallback for 7z archives that the pure-Rust decoder can't handle
# (LZMA solid archives created with 7zip's default settings).
# Requires libarchive to be available (available in org.gnome.Platform 49+).
# Enable with: cargo build --features libarchive-fallback
libarchive-fallback = ["dep:compress-tools"]

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[build-dependencies]
glib-build-tools = "0.21"
