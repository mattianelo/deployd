[package]
name = "deployd"
version = "1.1.1"
edition = "2024"

[dependencies]
relm4 = { version = "0.10", features = ["macros", "libadwaita"] }
relm4-components = "0.10"
gtk = { version = "0.10", package = "gtk4", features = ["v4_10"] }
libadwaita = { version = "0.8", features = ["v1_5"] }
glib = "0.21"
gio = "0.21"

# Core
anyhow = "1"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "chrono"] }
tokio = { version = "1", features = ["full"] }

# Mod handling
tempfile = "3"
walkdir = "2"
zip = "2"
sevenz-rust2 = "0.20"
compress-tools = { version = "0.15", optional = true }
unrar = "0.5"
quick-xml = { version = "0.36", features = ["serialize"] }
regex = "1"
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
md-5 = "0.10"
sha2 = "0.10"
dirs = "5"

# Nexus API
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
ashpd = { version = "0.13", features = ["file_chooser"] }
futures-util = "0.3"
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
open = "5"

# LOOT integration (optional feature)
libloot = { version = "0.29", optional = true }
crc32fast = { version = "1", optional = true }

[features]
default = ["loot"]
loot = ["dep:libloot", "dep:crc32fast"]
# Enable libarchive fallback for 7z archives that the pure-Rust decoder can't handle
# (LZMA solid archives created with 7zip's default settings).
# Requires libarchive to be available (available in org.gnome.Platform 49+).
# Enable with: cargo build --features libarchive-fallback
libarchive-fallback = ["dep:compress-tools"]
# Exposes in-progress features not ready for stable release: script extender
# launcher, profile export/import, and backup & restore UI.
experimental = []

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[build-dependencies]
glib-build-tools = "0.21"