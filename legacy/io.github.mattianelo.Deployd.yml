id: io.github.mattianelo.Deployd
runtime: org.gnome.Platform
runtime-version: '49'
sdk: org.gnome.Sdk
command: deployd

sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable

finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=session-bus
  - --device=dri
  - --filesystem=~/.var/app/com.heroicgameslauncher.hgl/config:ro
  - --filesystem=~/.var/app/com.heroicgameslauncher.hgl/data:ro
  - --filesystem=~/.var/app/com.valvesoftware.Steam/.local/share/Steam:rw
  - --filesystem=~/.local/share/Steam:rw
  - --filesystem=~/Games/Heroic:rw
  - --filesystem=~/.local/share/deployd:create

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/deployd/cargo

modules:
  - name: deployd
    buildsystem: simple
    build-commands:
      - cargo --offline fetch --manifest-path Cargo.toml --verbose
      - cargo --offline build --release --features loot,libarchive-fallback --verbose
      - install -Dm755 ./target/release/deployd /app/bin/deployd
      - install -Dm644 data/deployd.desktop /app/share/applications/io.github.mattianelo.Deployd.desktop
      - install -Dm644 data/deployd.metainfo.xml /app/share/metainfo/io.github.mattianelo.Deployd.metainfo.xml
      - install -Dm644 data/icons/hicolor/scalable/apps/deployd.svg /app/share/icons/hicolor/scalable/apps/io.github.mattianelo.Deployd.svg
      - install -Dm644 LICENSE /app/share/licenses/io.github.mattianelo.Deployd/LICENSE
    sources:
      - type: dir
        path: .
      - cargo-sources.json
